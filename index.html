<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>진짜가격 — 선택의 진짜 가격</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEFF3;--card:#FFFFFF;--soft:#F4F6F9;--ink:#0F1B2D;--muted:#586477;--line:#D3D9E1;
  --cobalt:#2340E8;--on-cobalt:#FFFFFF;
  --amber:#FFB020;--amber-soft:#FFF1D2;--amber-ink:#7A4700;
  --green:#0B8F63;--green-soft:#DDF4EA;--red:#C93A3A;--red-soft:#FBE4E4;
  --f-num:'Bricolage Grotesque','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D121A;--card:#151C27;--soft:#1B2431;--ink:#E9EFF7;--muted:#98A5B8;--line:#2A3546;
  --cobalt:#8AA0FF;--on-cobalt:#0D121A;--amber:#FFC24D;--amber-soft:#3A2E12;--amber-ink:#FFD98A;
  --green:#45D2A0;--green-soft:#133328;--red:#FF8A8A;--red-soft:#3A1B1E;}}
:root[data-theme="dark"]{
  --paper:#0D121A;--card:#151C27;--soft:#1B2431;--ink:#E9EFF7;--muted:#98A5B8;--line:#2A3546;
  --cobalt:#8AA0FF;--on-cobalt:#0D121A;--amber:#FFC24D;--amber-soft:#3A2E12;--amber-ink:#FFD98A;
  --green:#45D2A0;--green-soft:#133328;--red:#FF8A8A;--red-soft:#3A1B1E;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
button,.btn,label{-webkit-tap-highlight-color:transparent}
.btn:focus-within{outline:3px solid var(--cobalt);outline-offset:2px}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 140px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand svg{color:var(--cobalt);width:28px;height:28px}
h1{font-size:27px;line-height:1.28;letter-spacing:-.03em;margin:0 0 10px;font-weight:700}
h2{font-size:20px;line-height:1.35;letter-spacing:-.02em;margin:0 0 8px;font-weight:700}
h3{font-size:16.5px;margin:0 0 8px;font-weight:700}
p{margin:0 0 10px}
.lead{color:var(--muted);font-size:16.5px}
.small{font-size:14.5px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px}
.section{margin:26px 0 0}
.section>h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:17px;text-align:center}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack>*+*{margin-top:10px}
.back{background:none;border:0;padding:10px 0;margin:0 0 8px;color:var(--muted);font-size:17px;font-weight:600;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:15.5px;display:inline-flex;align-items:center;gap:7px}
.chip svg{flex:none;width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:15px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],textarea{width:100%;min-height:54px;font-size:18px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairbox{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin-bottom:14px}
.pairbox legend{font-weight:600;padding:0 6px;font-size:14px}
.err{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14.5px}
.banner{background:var(--amber-soft);color:var(--amber-ink);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14.5px}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);font-size:14.5px;margin:14px 0}
/* price bars */
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft);border:1px solid var(--line);margin:10px 0 12px}
.bar i{display:block;height:100%}
.s-vis{background:var(--ink)}
.s-time{background:var(--amber)}
.s-hass{background:repeating-linear-gradient(135deg,var(--amber) 0 4px,transparent 4px 8px)}
.s-ben{background:var(--green)}
.legend{margin:0;display:grid;gap:4px;font-size:14px}
.legend div{display:flex;justify-content:space-between;gap:12px}
.legend dt{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend dd{margin:0;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.opt.win{border-color:var(--ink)}
.opt-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:13.5px;font-weight:600;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.soft{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.tag.amb{background:var(--amber-soft);color:var(--amber-ink)}
.big{font-size:34px;font-weight:800;line-height:1.15;margin:6px 0 0}
.range{font-size:13px;color:var(--muted)}
.verdict{background:var(--soft);border-radius:16px;padding:14px 16px;margin:0 0 14px}
.verdict strong{font-weight:700}
/* hero */
.hero{margin:0 0 22px}
.hero .demo{margin:16px 0 4px}
.demo .bar{animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.demo .bar{animation:none}*{scroll-behavior:auto!important}}
.cta{display:grid;grid-template-columns:56px 1fr;column-gap:16px;row-gap:2px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px}
.cta .ico{grid-row:1/3;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--cobalt)}
.cta .ico svg{width:30px;height:30px}
.cta.main .ico{background:rgba(255,255,255,.18);color:inherit}
.survey{display:flex;align-items:center;gap:14px}
.survey>div{flex:1;min-width:0}
.survey b{display:block}
.survey .ico{flex:none;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--cobalt)}
.survey .ico svg{width:26px;height:26px}
.survey-cta{border-style:dashed}
h3>svg,h2>svg{width:22px;height:22px;vertical-align:-4px;margin-right:6px;color:var(--cobalt)}
.btn>svg{width:20px;height:20px;flex:none}
.seg2{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px;margin:0 0 14px}
.seg2 button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:16px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.stat2>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat2 span{display:block;font-size:13.5px;color:var(--muted)}
.stat2 b{display:block;font-size:24px;font-family:var(--f-num);letter-spacing:-.02em;margin-top:2px}
.kbar{display:grid;grid-template-columns:76px 1fr 40px;gap:10px;align-items:center;margin:0 0 10px;font-size:15px}
.kbar .meter{height:12px}
.vs{margin:0 0 12px}
.vs .lab{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.vs .duo{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.vs .duo i{display:block;height:100%}
.nudge{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:15.5px}
.nudge:first-of-type{border-top:0}
.nudge svg{flex:none;width:22px;height:22px;color:var(--amber-ink);margin-top:2px}
.goalbar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.goalbar i{display:block;height:100%;background:var(--green)}
.favrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.favrow:first-child{border-top:0}
.favrow .t{flex:1;min-width:0;font-weight:600}
.cta.main{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.cta b{font-size:20px;letter-spacing:-.02em;min-width:0}
.cta>span:not(.ico){font-size:15px;opacity:.85;min-width:0}
/* onboarding */
.prog{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 22px}
.prog i{display:block;height:100%;background:var(--cobalt);transition:width .3s}
.ob-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px 18px;margin-bottom:12px;min-height:76px}
.ob-opt b{display:block;font-size:20px;letter-spacing:-.02em}
.ob-opt span{color:var(--muted);font-size:15.5px}
.ob-opt:active{border-color:var(--cobalt)}
.kicker{font-size:14px;color:var(--muted);margin-bottom:6px}
.result-tp{font-size:52px;font-weight:800;line-height:1.05;margin:6px 0 4px}
/* rows */
.row{padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row-h .lab{font-weight:500}
.row-h .val{font-weight:700;white-space:nowrap}
.row-sub{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px;font-size:12.5px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--cobalt);height:32px;margin:0}
.grp{margin:20px 0 0}
.grp>h3{display:flex;align-items:center;gap:8px}
.ask{background:var(--amber-soft);color:var(--amber-ink);border-radius:16px;padding:14px 16px;margin:16px 0}
.ask .chip{background:var(--card);color:var(--ink)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:22px;font-weight:700;font-family:var(--f-num)}
.scale small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);font-family:var(--f-body)}
.emo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emo button{min-height:86px;font-size:38px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);line-height:1}
.emo small{display:block;font-size:13px;color:var(--muted);margin-top:6px}
/* lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--cobalt)}
.dim{display:grid;grid-template-columns:1fr 44px;gap:4px 12px;align-items:center;margin:0 0 12px;font-size:14.5px}
.dim .meter{grid-column:1/2}
.lock{opacity:.9}
.lock .badge2{font-size:12.5px;color:var(--muted)}
.unl{border-left:4px solid var(--green);padding-left:14px}
.bal{display:grid;gap:8px;margin:12px 0}
.bal .bar{margin:0}
.bal .lab{display:flex;justify-content:space-between;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs>div{display:flex;width:100%;max-width:520px}
.tab{position:relative;flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:14.5px;font-weight:600;min-height:64px}
.tab svg{width:28px;height:28px}
.tab[aria-current="page"]{color:var(--cobalt);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:700}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cobalt);animation:sp 1s linear infinite;margin:0 0 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw}
#toast.on{opacity:1}
pre.export{white-space:pre-wrap;max-height:220px;overflow:auto;background:var(--soft);border-radius:12px;padding:12px;font-size:12px;user-select:all}
.scroll-x{overflow-x:auto}

.strip{display:flex;gap:4px;margin:12px 0 6px}
.segb{min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.segb b{font-size:14px}
.segb span{color:var(--muted);font-size:12px}
.segb.hit{border-color:var(--ink)}
.segb.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.segb.cur span{color:inherit;opacity:.85}
/* 해외·가격 체크 */
select{width:100%;min-height:52px;font-size:16px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;color:inherit}
.conv{display:block;font-size:15px;color:var(--muted);margin-top:5px;min-height:1.2em}
.conv b{color:var(--ink);font-weight:600}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber-ink)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.lvl{border-radius:18px;padding:16px;margin:0 0 14px;border:1.5px solid transparent;display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.lvl>svg{width:48px;height:48px}
.lvl>div{min-width:0}
.lvl h2{margin:2px 0 4px;font-size:23px}
.lvl p{margin:0}
.lvl.ok{background:var(--green-soft);color:var(--green)}
.lvl.high,.lvl.low{background:var(--amber-soft);color:var(--amber-ink)}
.lvl.scam{background:var(--red-soft);color:var(--red)}
.lvl .small{color:inherit;opacity:.9}
.tstat{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--cobalt);border-radius:16px;padding:12px 14px;margin:0 0 14px}
.tstat .small{display:block}
.tstat>div{flex:1;min-width:0}
.tstat>svg{flex:none;width:36px;height:36px;color:var(--cobalt)}
.tstat b{font-size:17px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:16px}
.kv span:first-child{color:var(--muted)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.three div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.three b{display:block;font-size:17px}
.three span{font-size:13.5px;color:var(--muted)}
.fair{font-size:14px;margin:-4px 0 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ========= 유틸 ========= */
const KEY='jinjja-gagyeok:v1';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const won=n=>(Math.round(n)<0?'−':'')+fmt(Math.abs(n))+'원';
const signWon=n=>(Math.round(n)>0?'+':Math.round(n)<0?'−':'')+fmt(Math.abs(n))+'원';
const man=n=>{const a=Math.abs(n);const s=n<0?'−':'';return a>=10000?s+(a/10000).toFixed(a>=1e6?0:1).replace(/\.0$/,'')+'만원':s+fmt(a)+'원'};
const r500=n=>Math.max(500,Math.round(n/500)*500);
const uid=()=>Math.random().toString(36).slice(2,9);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const mm=m=>m<60?m+'분':Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':'');
const DAY=864e5,HR=36e5;
const dstr=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'월 '+d.getDate()+'일'};
const CAT={daily:'일상 이동·식사',trip:'여행·여가',buy:'물건 구매',activity:'모임·활동',other:'기타'};
const DEEP_CATS=['trip','buy','activity','other'];
const DUE_H={daily:3,trip:5*24,buy:7*24,activity:7*24,other:3*24};
const DIM={experience:'경험',relation:'관계',future:'미래 가치',wellbeing:'회복·즐거움',durable:'오래 쓰는 가치'};
const CTXS=['출근·등교','약속','주말·여가'];
const HASSLE=[{k:'rain',l:'비·눈',w:.3},{k:'bag',l:'짐 많음',w:.25},{k:'tired',l:'피곤함',w:.3},{k:'late',l:'늦은 밤(안전)',w:.4}];
const RATE_LABEL={5:'만족 😀',3:'보통 😐',1:'아쉬움 😞'};

/* ========= 저장소 ========= */
let storageOK=true;
function freshT(){return {on:false,city:'hanoi',cur:'VND',mult:1.5}}
function freshFX(){return {live:{},ts:0,date:'',manual:{}}}
function fresh(){return {v:1,onboarded:false,P:{time:null,risk:.5,future:.5,exp:.5,rel:.5,dur:.5,ctx:{}},D:[],T:freshT(),FX:freshFX(),PR:[],FAV:[],GOAL:null,SET:{rate:3},created:Date.now()}}
function migrate(o){
  if(!o.T||typeof o.T!=='object')o.T=freshT();
  if(!o.FX||typeof o.FX!=='object')o.FX=freshFX();
  if(!o.FX.live)o.FX.live={};if(!o.FX.manual)o.FX.manual={};
  if(!Array.isArray(o.PR))o.PR=[];
  if(!Array.isArray(o.FAV))o.FAV=[];
  if(o.GOAL&&!(o.GOAL.amount>0))o.GOAL=null;
  if(!o.GOAL)o.GOAL=null;
  if(!o.SET||typeof o.SET!=='object')o.SET={rate:3};
  if(!(o.SET.rate>=0&&o.SET.rate<=30))o.SET.rate=3;
  return o;
}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1&&o.P)return migrate(o)}}catch(e){storageOK=false}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){storageOK=false}}

/* ========= PWA 보조 ========= */

function calibrateSeg(seg,chosen,mult){
  const t=S.P.time;if(!t)return;
  const sg=seg.find(x=>x.idx===chosen);if(!sg)return;
  const k=mult>0?mult:1,from=sg.from/k,to=sg.to/k; /* 여행 모드 배수를 걷어내고 평소 시간 가격으로 보정 */
  let target=null;
  if(t.est<from)target=from;else if(t.est>to)target=to;
  if(target&&target>0&&isFinite(target)){const c=t.calib||0;setTime(Math.exp(.85*Math.log(t.est)+.15*Math.log(target)));S.P.time.calib=c+1}
}

function rateInfo(cur){
  if(cur==='KRW')return {r:1,src:'krw'};
  const F=S.FX;
  if(F.manual[cur]>0)return {r:F.manual[cur],src:'manual'};
  if(F.live[cur]>0)return {r:F.live[cur],src:'live'};
  return {r:(CURS[cur]||{fb:1}).fb,src:'fb'};
}
const toKRW=(n,cur)=>n*rateInfo(cur).r;
function fmtCur(n,cur){
  if(cur==='KRW')return won(n);
  const c=CURS[cur]||{s:cur,pre:false,d:0};
  const s=(+n).toLocaleString('ko-KR',{maximumFractionDigits:c.d,minimumFractionDigits:0});
  return c.pre?c.s+s:s+c.s;
}
/* 0 개수 헷갈림 방지: 250000 → "25만", 45000 → "4만 5천" */
function koUnit(n){
  n=Math.round(Math.abs(n));if(n<10000)return '';
  const eok=Math.floor(n/1e8),man=Math.floor(n%1e8/1e4),cheon=Math.floor(n%1e4/1e3),rest=n%1e3;
  return [eok?eok+'억':'',man?man+'만':'',cheon?cheon+'천':'',rest?rest:''].filter(Boolean).join(' ');
}
function convLine(v,cur){
  const n=parseFloat(v);
  if(!isFinite(n)||n<0||cur==='KRW')return '';
  const ku=koUnit(n),cn=(CURS[cur]||{}).n||cur;
  return `≈ <b>${won(toKRW(n,cur))}</b>${ku?` · ${ku} ${cn.split(' ').pop()}`:''}`;
}
function rateSrcText(cur){
  const i=rateInfo(cur);
  if(i.src==='manual')return '직접 입력한 환율';
  if(i.src==='live')return '실시간 환율'+(S.FX.ts?` (${dstr(S.FX.ts)} ${new Date(S.FX.ts).getHours()}시 받음)`:'');
  return '기본 환율 ('+FB_DATE+') · 인터넷 연결 시 자동 갱신';
}
let fxBusy=false;
async function refreshFX(force){
  if(fxBusy)return;
  if(!force&&S.FX.ts&&Date.now()-S.FX.ts<12*HR)return;
  if(typeof fetch!=='function')return;
  fxBusy=true;ui.fxMsg=force?'환율을 받아오는 중…':ui.fxMsg;if(force)render();
  try{
    const ctl=typeof AbortController!=='undefined'?new AbortController():null;
    const tm=setTimeout(()=>ctl&&ctl.abort(),8000);
    const res=await fetch('https://open.er-api.com/v6/latest/KRW',ctl?{signal:ctl.signal}:{});
    clearTimeout(tm);
    const j=await res.json();
    if(!j||j.result!=='success'||!j.rates)throw new Error('bad');
    const live={};Object.keys(CURS).forEach(c=>{const x=+j.rates[c];if(x>0&&isFinite(x))live[c]=1/x});
    if(!Object.keys(live).length)throw new Error('empty');
    S.FX.live=live;S.FX.ts=Date.now();S.FX.date=String(j.time_last_update_utc||'').slice(0,40);save();
    ui.fxMsg=force?'최신 환율로 바꿨어요.':'';
  }catch(e){
    ui.fxMsg=force?'환율을 받아오지 못했어요. 저장된 환율로 계산해요. 필요하면 아래에 직접 입력하세요.':'';
  }
  fxBusy=false;
  const ae=document.activeElement;
  if(force||!(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)))render();
}

}

function recMoney(d){

  if(!Array.isArray(d.opts)||!d.opts[d.chosen])return null;
  const m=d.opts.map(o=>+o.money||0),c=m[d.chosen];
  const fast=d.fastIdx>=0&&d.chosen===d.fastIdx;

}
function periodRecs(days){const since=Date.now()-days*DAY;return S.D.filter(d=>d.ts>=since)}
function reportStats(days){
  const recs=periodRecs(days);

  let saved=0,extraFast=0,cheap=0,spend=0,nMoney=0;

    const day=new Date(d.ts);day.setHours(0,0,0,0);daily[+day]=(daily[+day]||0)+m.saved});
  const rest=recs.filter(d=>optKind(d,d.chosen)==='rest').length,study=recs.filter(d=>optKind(d,d.chosen)==='study').length;

/* 시간 가격 p(원/시간)에 따라 가장 싼 선택지가 바뀌는 구간 (하한 포락선) */
function envelope(r){
  const seg=[];let p=0,cur=0;
  r.forEach((o,i)=>{if(o.money<r[cur].money-1e-9||(Math.abs(o.money-r[cur].money)<1e-9&&o.eff<r[cur].eff))cur=i});
  for(let g=0;g<6;g++){
    let nxt=-1,np=Infinity;
    r.forEach((o,j)=>{
      if(o.eff<r[cur].eff-1e-12){const x=(o.money-r[cur].money)/(r[cur].eff-o.eff);if(x>=p-1e-9&&x<np){np=x;nxt=j}}
    });
    if(nxt<0){seg.push({idx:cur,from:p,to:Infinity});break}
    seg.push({idx:cur,from:p,to:np});p=np;cur=nxt;
  }
  return seg.filter(x=>x.to-x.from>1);
}
function quickVerdict(r){
  const arg=k=>{let b=0;r.forEach((o,i)=>{if(o[k].total<r[b][k].total)b=i});return b};
  const bLo=arg('lo'),bMid=arg('mid'),bHi=arg('hi');
  const sorted=r.map((o,i)=>({i,t:o.mid.total})).sort((a,b)=>a.t-b.t);
  const gap=sorted[1].t-sorted[0].t;
  const minEff=Math.min(...r.map(o=>o.eff));
  const fl=r.map((o,i)=>i).filter(i=>Math.abs(r[i].eff-minEff)<1e-9);
  const tie=bLo===bHi&&gap<1;
  return {best:bMid,second:sorted[1].i,gap,tie,straddle:bLo!==bHi||tie,seg:envelope(r),fast:fl.length===1?fl[0]:-1};
}

/* ========= 심층 모드 계산 ========= */
function mkItem(group,label,kind,low,high,extra){
  const val=(low+high)/2;
  const max=kind==='hours'?Math.max(Math.ceil(high*2),4):Math.max(Math.ceil(high*2/1000)*1000,10000);
  return Object.assign({id:uid(),group,label,kind,low,high,val,max,src:'ai'},extra||{});
}
function benefitW(it){
  const P=S.P;
  const dw={experience:.6+.8*P.exp,relation:.6+.8*P.rel,future:.6+.8*P.future,durable:.6+.8*P.dur,wellbeing:1}[it.dim]||1;
  const pri=(P.ctx[ui.deep.category]||{}).pri;
  const pf=pri==='value'?1.25:pri==='cost'?.8:1;
  return {dw,pf,f:dw*pf};
}
const aversion=()=>.7+.6*(1-S.P.risk);
function itemVals(it){
  const t=tp();
  let lo,mid,hi;
  if(it.kind==='hours'){lo=it.low*t.low;mid=it.val*t.mid;hi=it.high*t.high}else{lo=it.low;mid=it.val;hi=it.high}
  let f=1;
  if(it.group==='benefit')f=benefitW(it).f;
  else if(it.group==='risk')f=(it.prob==null?.3:it.prob)*aversion();
  return {lo:lo*f,mid:mid*f,hi:hi*f,f};
}
function deepTotals(items){
  const c={lo:0,mid:0,hi:0},b={lo:0,mid:0,hi:0};let vis=0;
  items.forEach(it=>{const v=itemVals(it),tgt=it.group==='benefit'?b:c;tgt.lo+=v.lo;tgt.mid+=v.mid;tgt.hi+=v.hi;if(it.group==='direct')vis+=v.mid});
  return {c,b,vis,net:{mid:b.mid-c.mid,lo:b.lo-c.hi,hi:b.hi-c.lo}};
}

    cost:num(r.direct_cost,0,1e9,0),

function weekly(){

function makeDemo(){
  const R=rng(11),now=Date.now(),out=[];
  const T={daily:['택시 vs 버스','배달 vs 직접 요리','KTX vs 시외버스','카페 작업 vs 집 공부'],trip:['친구들과 제주 여행','당일치기 바다 여행','주말 근교 캠핑'],buy:['노트북 교체','무선 이어폰 구매','운동화 구매','전공서적 새 책 vs 중고'],activity:['동아리 A 가입','스터디 참여','주말 알바 추가','학회 행사 참석']};
  const plan=['daily','daily','buy','daily','trip','activity','daily','buy','daily','activity','daily','trip','daily','buy','activity','daily','daily','buy','trip','daily','activity','daily','buy','daily','activity','daily','daily','trip','buy','daily','daily','activity','daily','buy','daily','daily','trip','activity','daily','buy','daily','daily','activity','daily'];
  const PW={trip:[.2,.5,.3],buy:[.15,.45,.4],activity:[.1,.5,.4],daily:[.15,.5,.35]};
  plan.forEach((cat,i)=>{
    const ts=now-((plan.length-i)*1.2+R()*.5)*DAY,list=T[cat],title=list[Math.floor(R()*list.length)];
    const pred=cat==='trip'?(R()<.7?5:4):cat==='buy'?(R()<.5?4:5):cat==='activity'?(R()<.5?3:4):(R()<.6?3:4);
    const d={id:uid(),ts,mode:cat==='daily'?'quick':'deep',cat,title,demo:true,predicted:pred,due:ts+DUE_H[cat]*HR,outcome:null,net:0};
    if(cat==='daily'){
      const nm=title.split(' vs ');d.options=[{name:nm[0]},{name:nm[1]||'다른 선택'}];d.fastIdx=0;d.ctx=CTXS[Math.floor(R()*3)];
      d.be=6000+R()*30000;d.favored=d.be<tp().mid?0:1;d.chosen=R()<.55?0:1;

    if(d.due<now&&R()<.92){
      const rating=pickW(R,PW[cat]);
      d.outcome={rating,again:rating===5?(R()<.95?'same':'diff'):rating===3?(R()<.7?'same':'diff'):(R()<.85?'diff':'same'),note:'',ts:d.due+HR};
    }
    out.push(d);
  });

function dimBars(){
  const P=S.P;
  const rows=[['경험에 쓰는 편',P.exp],['관계를 우선하는 편',P.rel],['미래를 위해 기다리는 편',P.future],['불확실성을 감수하는 편',P.risk],['오래 쓸 물건을 고르는 편',P.dur]];
  return rows.map(r=>`<div class="dim"><span>${r[0]}</span><span class="num" style="text-align:right">${Math.round(r[1]*100)}</span><div class="meter" role="img" aria-label="${r[0]} ${Math.round(r[1]*100)}점"><i style="width:${r[1]*100}%"></i></div></div>`).join('')+'<p class="small" style="margin:0">설문 기반 추정이에요. 실제 선택과 회고로 계속 보정돼요.</p>';
}

/* ========= 뷰: 이 가격 괜찮아? ========= */
function chkItem(){
  const c=ui.chk;
  if(c.item==='custom'||S.T.city==='other'){
    const lo=parseFloat(c.custom.lo),hi=parseFloat(c.custom.hi);
    const name=(c.custom.name||'').trim();
    const ok=isFinite(lo)&&lo>=0&&isFinite(hi)&&hi>0;
    return {k:'custom:'+name,n:name||'직접 입력 항목',lo:ok?Math.min(lo,hi):null,hi:ok?Math.max(lo,hi):null,tip:'',custom:true};
  }
  return findItem(S.T.city,c.item)||null;
}
function recsFor(key){return S.PR.filter(p=>p.city===S.T.city&&p.item===key).sort((a,b)=>b.ts-a.ts)}
function askPrompt(it,amt,cur){
  const where=S.T.city==='other'?'지금 여행 중인 도시':cityName();
  return `${where}에서 "${it.n}"에 ${fmtCur(amt,cur)}(약 ${won(toKRW(amt,cur))})를 내라고 합니다. 현지 적정 가격 범위가 어느 정도인지, 바가지인지, 흥정한다면 얼마를 제시하면 좋을지, 흔한 바가지 수법이 있는지 알려주세요. 확실하지 않은 정보는 확실하지 않다고 말해 주세요.`;
}

  if(c.done&&it&&isFinite(asked)&&asked>=0){

    let box='',haggle='';
    if(hasRange){

        :`<p class="small" style="margin-top:0">기록해 두면 다음에 같은 항목을 볼 때 내가 낸 가격이 같이 보여요.</p><button class="btn sm" data-a="chk-log1">낸 가격 기록하기</button>`}

  const recHtml=recs.length?`<div class="card"><h3>내 기록 <span class="small" style="font-weight:400">· ${recs.length}개 · 평균 ${fmtCur(niceRound(avg(recs.map(r=>r.amount)),cur),cur)}</span></h3>${recs.slice(0,5).map(r=>`<div class="item"><div><div class="t num">${fmtCur(r.amount,r.cur)} <span class="small">≈ ${won(toKRW(r.amount,r.cur))}</span></div><div class="small">${dstr(r.ts)}${r.note?' · '+esc(r.note):''}</div></div><button class="btn ghost sm" data-a="pr-del" data-id="${r.id}" aria-label="이 기록 지우기">지우기</button></div>`).join('')}</div>`:'';
  const chipsList=items.map(x=>({v:x.k,l:x.n,ic:itemIc(x.k)})).concat([{v:'custom',l:'직접 입력',ic:IC.pen}]);
  return `<button class="back" data-a="home-menu">‹ 홈</button>

/* ========= 뷰: 리포트 ========= */
function cumChart(st){
  const n=st.days,W=340,H=150,pl=8,pr=8,pt=18,pb=26;
  const start=new Date(Date.now()-(n-1)*DAY);start.setHours(0,0,0,0);
  let acc=0;const pts=[];
  for(let i=0;i<n;i++){const k=+start+i*DAY;acc+=st.daily[k]||0;pts.push(acc)}
  const mx=Math.max(acc,1),x=i=>pl+(W-pl-pr)*(n===1?0:i/(n-1)),y=v=>pt+(H-pt-pb)*(1-v/mx);
  const line=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=line+` L${x(n-1).toFixed(1)} ${H-pb} L${x(0).toFixed(1)} ${H-pb} Z`;
  const d0=new Date(+start),d1=new Date();
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${n}일 동안 아낀 돈 누적 ${won(acc)}">
    <line x1="${pl}" y1="${H-pb}" x2="${W-pr}" y2="${H-pb}" style="stroke:var(--line)" stroke-width="1"/>
    <line x1="${pl}" y1="${pt}" x2="${W-pr}" y2="${pt}" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="${area}" style="fill:var(--green-soft)"/>
    <path d="${line}" style="fill:none;stroke:var(--green)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y(acc)}" r="4.5" style="fill:var(--green)"/>
    <text x="${pl}" y="${pt-5}" style="fill:var(--muted);font-size:12px">${won(mx)}</text>
    <text x="${pl}" y="${H-8}" style="fill:var(--muted);font-size:12px">${d0.getMonth()+1}/${d0.getDate()}</text>
    <text x="${W-pr}" y="${H-8}" text-anchor="end" style="fill:var(--muted);font-size:12px">오늘</text>
  </svg>`;
}
function vsBar(l1,n1,c1,l2,n2,c2){
  const t=n1+n2;if(!t)return '';
  return `<div class="vs"><div class="lab"><span>${l1} <b class="num">${n1}</b></span><span>${l2} <b class="num">${n2}</b></span></div>
    <div class="duo" role="img" aria-label="${l1} ${n1}번, ${l2} ${n2}번"><i style="width:${n1/t*100}%;background:${c1}"></i><i style="width:${n2/t*100}%;background:${c2}"></i></div></div>`;
}

function segRange(sg){
  if(sg.from<=0)return fmt(sg.to)+'원 이하';
  if(!isFinite(sg.to))return fmt(sg.from)+'원 이상';
  return fmt(sg.from)+' ~ '+fmt(sg.to)+'원';
}
function segStrip(r,v){
  const t=tpq();
  const fin=v.seg.map(x=>x.to).filter(isFinite);
  const maxP=Math.max(20000,(fin.length?Math.max(...fin):0)*1.4,t.high*1.3);
  const hit=x=>x.from<=t.high&&x.to>=t.low;
  return `<div class="strip">${v.seg.map(x=>{
    const len=Math.min(x.to,maxP)-x.from,cur=x.from<=t.mid&&t.mid<x.to;
    return `<div class="segb ${cur?'cur':hit(x)?'hit':''}" style="flex:${Math.max(len/maxP,.16).toFixed(3)}"><b>${esc(r[x.idx].name)}</b><span class="num">${segRange(x)}</span></div>`;
  }).join('')}</div>`;
}
/* 저울: 진짜 가격이 무거운 쪽이 내려간다 */
function scaleHtml(r){
  const a=r[0].mid.total,b=r[1].mid.total,mx=Math.max(a,b,1);
  const ang=Math.max(-16,Math.min(16,(b-a)/mx*28)),rad=ang*Math.PI/180;
  const cx=170,cy=46,L=120,lx=cx-L*Math.cos(rad),ly=cy-L*Math.sin(rad),rx=cx+L*Math.cos(rad),ry=cy+L*Math.sin(rad);
  const pan=(x,y)=>`<line x1="${x}" y1="${y}" x2="${x-26}" y2="${y+40}" style="stroke:var(--muted)" stroke-width="1.5"/><line x1="${x}" y1="${y}" x2="${x+26}" y2="${y+40}" style="stroke:var(--muted)" stroke-width="1.5"/><path d="M${x-34} ${y+40} Q${x} ${y+64} ${x+34} ${y+40} Z" style="fill:var(--soft);stroke:var(--ink)" stroke-width="2"/>`;
  const lab=(x,y,o,lite)=>`<text x="${x}" y="${y+84}" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:14px">${esc(o.name.length>9?o.name.slice(0,9)+'…':o.name)}</text><text x="${x}" y="${y+102}" text-anchor="middle" style="fill:${lite?'var(--green)':'var(--muted)'};font-size:13px;font-weight:600">${won(o.mid.total)}</text>`;
  const light=Math.abs(a-b)<1?-1:a<b?0:1;
  return `<div class="card" style="padding:14px 10px 6px"><svg viewBox="0 0 340 ${Math.max(ly,ry)+112}" width="100%" role="img" aria-label="저울: ${esc(r[0].name)} ${won(a)}, ${esc(r[1].name)} ${won(b)}">
    <path d="M${cx-30} ${Math.max(ly,ry)+108} L${cx+30} ${Math.max(ly,ry)+108} L${cx} ${cy+6} Z" style="fill:var(--line)"/>
    <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" style="stroke:var(--ink)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" style="fill:var(--cobalt)"/>
    ${pan(lx,ly)}${pan(rx,ry)}${lab(lx,ly,r[0],light===0)}${lab(rx,ry,r[1],light===1)}
  </svg><p class="small" style="margin:0 6px 8px;text-align:center">${light<0?'두 선택지의 무게(진짜 가격)가 거의 같아요.':`진짜 가격이 가벼운 <b style="color:var(--green)">${esc(r[light].name)}</b> 쪽이 더 이득이에요.`}</p></div>`;
}
/* 기회비용: 아낀 돈을 적금·반복·목표로 환산 */

  </div>`;
}
const favKey=q=>{const one=x=>x?(x.name||'')+'|'+(x.money||'')+'|'+(x.mins||''):'';return one(q.a)+'/'+one(q.b)+'/'+(q.showC===undefined||q.showC?one(q.c):'')};
function viewQuickResult(){
  const q=ui.quick,R=q.result,r=R.rows,v=R.verdict,t=tpq();
  const max=Math.max(...r.map(o=>o.mid.total),1);
  let verdict;
  if(v.tie)verdict=`선택지들의 진짜 가격이 <strong>거의 같아요.</strong> 값어치는 취향과 그날의 사정에 따라 갈려요.`;
  else if(v.straddle)verdict=`내 시간 가격 범위(${won(t.low)} ~ ${won(t.high)}) 안에서 <strong>가장 싼 선택지가 바뀌어요.</strong> 값어치는 취향과 그날의 사정에 따라 갈려요.`;
  else verdict=`내 시간 가격(약 ${fmt(t.mid)}원/시간) 기준으로 <strong>${esc(r[v.best].name)}</strong>의 진짜 가격이 가장 낮아요. 다음으로 낮은 ${esc(r[v.second].name)}보다 약 <strong>${won(v.gap)}</strong> 낮아요.`;
  let sub='';
  if(v.seg.length>1){
    const parts=v.seg.map(x=>{const n=esc(r[x.idx].name);return x.from<=0?`${won(x.to)} 이하로 치면 ${n}`:!isFinite(x.to)?`${won(x.from)} 이상이면 ${n}`:`${won(x.from)}~${won(x.to)}이면 ${n}`});
    sub=`<p class="small" style="margin:8px 0 0">시간을 시간당 ${parts.join(', ')} 쪽이 가장 싸요.</p>${segStrip(r,v)}<p class="small" style="margin:0">진한 칸이 내 시간 가격이 속한 구간이에요.</p>`;
  }else sub=`<p class="small" style="margin:8px 0 0">${esc(r[v.seg[0].idx].name)} 쪽이 어떤 시간 가격에서도 가장 싸요.</p>`;
  const inSeg=new Set(v.seg.map(x=>x.idx)),never=r.filter((o,i)=>!inSeg.has(i));
  if(never.length&&r.length>2)sub+=`<p class="small" style="margin:6px 0 0">${never.map(o=>esc(o.name)).join(', ')} 쪽은 어떤 시간 가격에서도 가장 싸지 않아요.</p>`;
  const head=`<button class="back" data-a="q-edit">‹ 수정하기</button><h1 style="font-size:24px">진짜 가격</h1>
    <p class="small" style="margin:-4px 0 10px">자동 분류 <span class="tag soft">${KIND[classify(r.map(o=>o.name).join(' '))]}</span></p>
    ${S.T.on?`<p class="small">여행 모드 · ${esc(cityName())} · 시간 가격 ×${S.T.mult} (시간당 약 ${won(t.mid)}) · ${esc(rateSrcText(cityCur()))}</p>`:''}
    <div class="verdict"><p style="margin:0">${verdict}</p>${sub}</div>
    ${r.length===2?scaleHtml(r):''}
    ${r.map((o,i)=>optCard(o,max,!v.straddle&&v.best===i)).join('')}
    ${oppHtml(r)}`;
  if(q.stage==='result'){
    const favd=S.FAV.some(f=>favKey(f)===favKey(q));
    return head+`<button class="btn block" data-a="q-fav" ${favd?'disabled':''} style="margin-bottom:14px">${IC.star}${favd?'즐겨찾기에 저장돼 있어요':'이 비교 즐겨찾기에 저장'}</button>
    <div class="card"><h2>어느 쪽을 고르셨나요?</h2><p class="small">고른 뒤에 만족도를 예상해서 남기면, 나중에 예측이 얼마나 맞았는지 알 수 있어요.</p>
    <div class="stack">${r.map((o,i)=>`<button class="btn block" data-a="q-pick" data-i="${i}">${esc(o.name)}</button>`).join('')}</div></div>
    <button class="btn ghost block" data-a="home-menu">아직 안 정했어요 (기록 안 함)</button>`;
  }
  return head+predictCard(r[q.chosen].name+' 선택','q-pred');
}

function insightL1(){
  const q=S.D.filter(d=>d.mode==='quick'&&d.ctx&&d.fastIdx>=0);
  if(!q.length)return '<p class="small" style="margin:0">상황을 고른 빠른 모드 결정이 아직 없어요.</p>';
  return CTXS.map(c=>{
    const a=q.filter(d=>d.ctx===c);
    if(a.length<3)return `<div class="item"><span>${c}</span><span class="small">표본 ${a.length}건 · 아직 판단하기 이릅니다</span></div>`;
    const p=Math.round(a.filter(d=>d.chosen===d.fastIdx).length/a.length*100);
    return `<div class="item"><span>${c}</span><span class="num"><b>${p}%</b> <span class="small">시간 절약 선택 (${a.length}건)</span></span></div>`;
  }).join('');
}
function insightL2(rv){
  const bias=avg(rv.map(d=>d.predicted))-avg(rv.map(d=>d.outcome.rating));
  const head=Math.abs(bias)<.3?'예측이 실제와 비교적 잘 맞는 편이에요.':bias>0?`전체적으로 만족도를 실제보다 <b>${bias.toFixed(1)}점 높게</b> 예상하는 경향이 있어요.`:`전체적으로 만족도를 실제보다 <b>${Math.abs(bias).toFixed(1)}점 낮게</b> 예상하는 경향이 있어요.`;
  const rows=Object.keys(CAT).map(c=>{
    const a=rv.filter(d=>d.cat===c);if(a.length<3)return '';
    const p=avg(a.map(d=>d.predicted)),ac=avg(a.map(d=>d.outcome.rating)),b=p-ac;
    return `<div class="item"><span>${CAT[c]} <span class="small">(${a.length}건)</span></span><span class="num"><b>${p.toFixed(1)} → ${ac.toFixed(1)}</b> <span class="small" style="color:${b>.5?'var(--red)':b<-.5?'var(--green)':'var(--muted)'}">${b>0?'+':''}${b.toFixed(1)}</span></span></div>`;
  }).join('');
  return `<p style="margin:0 0 6px">${head}</p>${rows}<p class="small" style="margin:8px 0 0">예측 점수 → 실제 점수 (😀=5, 😐=3, 😞=1로 환산)</p>`;
}
function insightL3(rv){
  const reg=Object.keys(CAT).map(c=>{const a=rv.filter(d=>d.cat===c);return a.length>=4?{c,n:a.length,p:a.filter(d=>d.outcome.again==='diff').length/a.length}:null}).filter(Boolean).sort((x,y)=>y.p-x.p);
  const ag=rv.filter(d=>d.favored!=null&&d.favored===d.chosen),dg=rv.filter(d=>d.favored!=null&&d.favored!==d.chosen);
  let s='';
  if(reg.length)s+=`<p style="margin:0 0 6px">다시 선택하면 다르게 고르겠다는 비율이 가장 높은 유형은 <b>${CAT[reg[0].c]}</b>예요 (${Math.round(reg[0].p*100)}%, ${reg[0].n}건).</p>`;
  if(ag.length>=5&&dg.length>=5)s+=`<p style="margin:0">분석 결과와 같은 쪽을 고른 결정의 만족도 평균은 <b>${avg(ag.map(d=>d.outcome.rating)).toFixed(1)}점</b>, 다른 쪽을 고른 결정은 <b>${avg(dg.map(d=>d.outcome.rating)).toFixed(1)}점</b>이에요.</p>`;
  else s+=`<p class="small" style="margin:0">분석과 같은/다른 선택을 비교하려면 각각 5건 이상 필요해요 (현재 ${ag.length}건 / ${dg.length}건).</p>`;
  return s;
}

  'copy-tp':()=>{const t=tp();copyText(`내 시간 가격은 시간당 약 ${fmt(t.mid)}원 (${fmt(t.low)}~${fmt(t.high)}원) — 진짜가격`)},
  'home-menu':()=>{ui.home='menu';ui.err='';ui.copyBox='';ui.quick=newQuick();ui.deep=newDeep();ui.chk.done=false;ui.chk.logOpen=false;ui.fxMsg='';ui.copyBox='';go()},
  /* 해외 여행 모드 */
  'open-travel':()=>{ui.home='travel';ui.tab='home';ui.err='';go()},
  'open-check':()=>{ui.home='check';ui.tab='home';ui.err='';go()},
  't-on':d=>{S.T.on=d.v==='1';save();if(S.T.on)refreshFX(false);ui.quick=newQuick();ui.deep=newDeep();render()},
  't-city':d=>{S.T.city=d.v;if(d.v!=='other'&&CITY[d.v])S.T.cur=CITY[d.v].cur;save();ui.chk=newChk();ui.quick=newQuick();render()},
  't-cur':d=>{S.T.cur=d.v;save();ui.chk=newChk();ui.quick=newQuick();render()},
  't-mult':d=>{S.T.mult=+d.v;save();render()},
  'fx-refresh':()=>{refreshFX(true)},
  'fx-clear':()=>{delete S.FX.manual[cityCur()];save();render()},
  'chk-item':d=>{const c=ui.chk;c.item=c.item===d.v?'':d.v;c.done=false;c.logOpen=false;ui.err='';render()},
  'chk-run':()=>{const c=ui.chk,a=parseFloat(c.asked);if(!isFinite(a)||a<0){ui.err='부른 가격을 0 이상 숫자로 넣어 주세요.';c.done=false;return render()}
    const it=chkItem();if(it&&it.custom&&!(c.custom.name||'').trim()){ui.err='항목 이름을 적어 주세요.';c.done=false;return render()}
    ui.err='';c.done=true;c.paid=c.paid||c.asked;render();const el=document.querySelector('.lvl');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start',behavior:'smooth'})},
  'chk-log1':()=>{ui.chk.logOpen=true;render()},
  'chk-log0':()=>{ui.chk.logOpen=false;render()},
  'chk-save':()=>{const c=ui.chk,it=chkItem(),a=parseFloat(c.paid);if(!it||!isFinite(a)||a<0){ui.err='낸 금액을 0 이상 숫자로 넣어 주세요.';return render()}
    S.PR.push({id:uid(),ts:Date.now(),city:S.T.city,cityName:cityName(),item:it.k,name:it.n,cur:cityCur(),amount:a,note:(c.note||'').slice(0,80)});
    if(S.PR.length>500)S.PR=S.PR.slice(-500);
    save();ui.err='';c.logOpen=false;c.note='';toast('가격을 기록했어요');render()},
  'chk-ask':()=>{const c=ui.chk,it=chkItem(),a=parseFloat(c.asked);if(it&&isFinite(a))copyText(askPrompt(it,a,cityCur()),true)},
  'copybox-close':()=>{ui.copyBox='';render()},
  'pr-del':d=>{S.PR=S.PR.filter(p=>p.id!==d.id);save();render()},
  'open-quick':()=>{ui.home='quick';ui.err='';go()},
  'open-deep':()=>{ui.home='deep';ui.err='';go()},
  /* 빠른 모드 */
  'q-example':()=>{const q=ui.quick,ex=S.T.on?QEX[S.T.city]:null;
    if(ex){q.a=Object.assign({},ex.a);q.b=Object.assign({},ex.b);q.c=ex.c?Object.assign({},ex.c):{name:'',money:'',mins:'',ref:''};q.showC=!!ex.c;q.has=['bag'];q.ctx='주말·여가'}
    else{q.a={name:'택시',money:'15000',mins:'10',ref:''};q.b={name:'버스',money:'2000',mins:'35',ref:''};q.c={name:'걷기',money:'0',mins:'60',ref:''};q.showC=true;q.ctx='출근·등교'}
    ui.err='';go()},
  'q-toggle-c':()=>{ui.quick.showC=!ui.quick.showC;ui.err='';render()},
  'q-ctx':d=>{ui.quick.ctx=ui.quick.ctx===d.v?null:d.v;render()},
  'q-has':d=>{const h=ui.quick.has,i=h.indexOf(d.v);if(i<0)h.push(d.v);else h.splice(i,1);render()},
  'q-run':()=>{
    const rows=validQuick();if(!rows){return render()}
    ui.err='';const q=ui.quick;
    const hs=HASSLE.filter(x=>q.has.includes(x.k)).reduce((s,x)=>s+x.w,0);
    const r=evalOpts(rows,hs);q.result={rows:r,verdict:quickVerdict(r)};q.stage='result';q.chosen=null;go();
  },
  'q-edit':()=>{ui.quick.stage='form';go()},
  'q-fav':()=>{const q=ui.quick,one=x=>({name:x.name||'',money:x.money||'',mins:x.mins||'',ref:x.ref||''});
    const f={id:uid(),label:[q.a,q.b].concat(q.showC?[q.c]:[]).map(x=>(x.name||'').trim()||'선택지').join(' vs ').slice(0,40),a:one(q.a),b:one(q.b),c:q.showC?one(q.c):null,ctx:q.ctx,has:q.has.slice(),travel:!!S.T.on};
    if(!S.FAV.some(x=>favKey(x)===favKey(f))){S.FAV.unshift(f);S.FAV=S.FAV.slice(0,12);save();toast('즐겨찾기에 저장했어요')}render()},
  'q-favload':d=>{const f=S.FAV.find(x=>x.id===d.id);if(!f)return;const q=ui.quick,cp=x=>Object.assign({name:'',money:'',mins:'',ref:''},x||{});
    q.a=cp(f.a);q.b=cp(f.b);q.c=cp(f.c);q.showC=!!f.c;q.ctx=f.ctx||null;q.has=(f.has||[]).slice();ui.err='';toast('불러왔어요. 금액만 고치고 바로 비교하세요');render()},
  'q-favdel':d=>{S.FAV=S.FAV.filter(x=>x.id!==d.id);save();render()},
  'q-pick':d=>{ui.quick.chosen=+d.i;ui.quick.stage='predict';render();window.scrollTo(0,document.body.scrollHeight)},
  'q-pred':d=>{
    const q=ui.quick,r=q.result.rows,v=q.result.verdict,ts=Date.now();
    const rec={id:uid(),ts,mode:'quick',cat:'daily',title:r.map(o=>o.name).join(' vs '),ctx:q.ctx,options:r.map(o=>({name:o.name})),chosen:q.chosen,favored:v.straddle?null:v.best,predicted:+d.n,net:v.gap,be:null,fastIdx:v.fast,due:ts+DUE_H.daily*HR,outcome:null};
    if(S.T.on)rec.travel=cityName();
    rec.opts=r.map(o=>({name:o.name,money:Math.round(o.money),mins:o.mins}));
    rec.kind=classify(rec.title);
    S.D.push(rec);
    calibrateSeg(v.seg,q.chosen,tMult());
    save();ui.saved={title:rec.title,pred:rec.predicted,when:'오늘 저녁'};ui.quick=newQuick();ui.home='saved';go();
  },
  /* 심층 모드 */
  'd-cat':d=>{ui.deep.category=d.v;render()},
  'd-cur':d=>{ui.deep.cur=d.v;render()},
  'd-copy':()=>{const d=ui.deep;if(!d.text.trim()){ui.err='선택 상황을 한 줄이라도 적어주세요.';return render()}ui.err='';copyText(askDeepPrompt(d),true)},
  'd-ai':()=>{deepAI()},
  'd-tpl':()=>{deepTpl()},
  'd-cancel':()=>{if(ui.deep.ctl)ui.deep.ctl.abort();ui.deep.ctl=null;ui.deep.stage='form';go()},
  'd-back':()=>{ui.deep.stage='form';go()},
  'd-ctx':d=>{S.P.ctx[ui.deep.category]={pri:d.v,ts:Date.now()};save();render()},
  'd-pick':d=>{ui.deep.chosen=+d.i;ui.deep.stage='predict';render();window.scrollTo(0,document.body.scrollHeight)},
  'd-pred':d=>{
    const dp=ui.deep,V=deepVerdict(deepTotals(dp.items)),ts=Date.now(),cat=dp.category;
    const rec={id:uid(),ts,mode:'deep',cat,kind:DEEP_KIND[cat]||classify(dp.title),title:dp.title,options:[{name:'하기'},{name:'하지 않기'}],chosen:dp.chosen,favored:V.fav,predicted:+d.n,net:deepTotals(dp.items).net.mid,due:ts+DUE_H[cat]*HR,outcome:null};
    S.D.push(rec);save();
    const days=Math.round(DUE_H[cat]/24);
    ui.saved={title:rec.title,pred:rec.predicted,when:days>=1?days+'일 뒤':'오늘 저녁'};ui.deep=newDeep();ui.home='saved';go();
  },
  /* 회고 */
  'rev-open':d=>{ui.rev=d.id;ui.revStep=0;ui.revNote='';ui.revMsg='';go()},
  'rev-close':()=>{ui.rev=null;go()},
  'rev-rate':d=>{ui.revRating=+d.r;ui.revStep=1;go()},
  'rev-again':d=>{saveOutcome(ui.rev,ui.revRating,d.v,ui.revNote);ui.rev=null;ui.revStep=0;go()},
  /* 프로필 */
  'export':()=>{doExport()},
  'export-close':()=>{ui.exportText='';render()},
  'retake':()=>{ui.ob=newOb(true);go()},
  'survey':()=>{ui.ob=newOb(true);go()},
  'rep-days':d=>{ui.repDays=+d.v;render()},
  'open-goal':()=>{ui.tab='home';ui.home='goal';ui.err='';go()},
  'goal-save':()=>{const f=ui.goalForm,g=S.GOAL,name=(f.name||(g?g.name:'')).trim(),amt=parseFloat(f.amount||(g?g.amount:''));
    if(!name){ui.err='무엇을 위해 모으는지 적어 주세요.';return render()}
    if(!isFinite(amt)||amt<=0){ui.err='목표 금액을 1원 이상으로 넣어 주세요.';return render()}
    S.GOAL={name:name.slice(0,30),amount:Math.round(amt),start:Date.now(),manual:0};ui.goalForm={name:'',amount:'',add:''};ui.err='';save();toast('목표를 정했어요');render()},
  'goal-add':()=>{const a=parseFloat(ui.goalForm.add);if(!S.GOAL)return;if(!isFinite(a)||a<=0){ui.err='더할 금액을 1원 이상으로 넣어 주세요.';return render()}
    S.GOAL.manual=(S.GOAL.manual||0)+Math.round(a);ui.goalForm.add='';ui.err='';save();toast(won(a)+'을 더했어요');render()},
  'goal-del':()=>{S.GOAL=null;save();toast('목표를 지웠어요');ui.home='menu';go()},
  'tp-set':()=>{const v=parseFloat(ui.tpDirect);if(!isFinite(v)||v<1000||v>1e6){toast('1,000원~1,000,000원 사이로 넣어 주세요');return}
    setTime(v);S.P.time.calib=0;S.onboarded=true;ui.tpDirect='';save();toast('내 시간 가격을 시간당 '+won(v)+'으로 정했어요');render()},
  'demo-load':()=>{S.D=S.D.concat(makeDemo());save();toast('데모 데이터를 불러왔어요');render()},
  'demo-clear':()=>{S.D=S.D.filter(d=>!d.demo);save();toast('데모 데이터를 지웠어요');render()},
  'import-apply':()=>{S=ui.importPending;ui.importPending=null;ui.importMsg='백업을 불러왔어요.';ui.ob=newOb(false);save();go()},
  'import-cancel':()=>{ui.importPending=null;render()},
  'pwa-install':()=>{if(installEv){installEv.prompt();installEv=null}render()},
  'pwa-hide':()=>{S.hideInstall=true;save();render()},
  'del1':()=>{ui.confirmDel=true;render()},
  'del0':()=>{ui.confirmDel=false;render()},
  'del2':()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();ui.confirmDel=false;ui.exportText='';ui.quick=newQuick();ui.deep=newDeep();ui.home='menu';ui.tab='home';ui.ob=newOb(false);go()}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  const f=ACT[b.dataset.a];if(f)f(b.dataset,b);
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t&&t.dataset&&t.dataset.fxman!==undefined){render();return}
  if(!t||!t.dataset||t.dataset.import===undefined)return;
  const f=t.files&&t.files[0];if(!f)return;
  ui.importMsg='';ui.importPending=null;
  try{
    if(f.size>5e6)throw new Error('big');
    const o=cleanImport(JSON.parse(await f.text()));
    if(!o)throw new Error('bad');
    ui.importPending=o;
  }catch(err){ui.importMsg='이 진짜가격 백업 파일이 아니에요. 내보내기로 받은 JSON 파일을 골라 주세요.'}
  t.value='';render();
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t||!t.dataset)return;
  if(t.dataset.bind){
    setPath(ui,t.dataset.bind,t.value);
    if(t.dataset.conv){const o=document.querySelector(`[data-conv-out="${t.dataset.conv}"]`);if(o)o.innerHTML=convLine(t.value,t.dataset.cur)}
    return}
  if(t.dataset.rate){const v=parseFloat(t.value);if(isFinite(v)&&v>=0&&v<=30){S.SET.rate=v;save()}return}
  if(t.dataset.fxman){const v=parseFloat(t.value);if(isFinite(v)&&v>0)S.FX.manual[t.dataset.fxman]=v;else delete S.FX.manual[t.dataset.fxman];save();return}
  if(t.dataset.slide){
    const it=ui.deep.items.find(x=>x.id===t.dataset.slide);if(!it)return;
    const v=parseFloat(t.value);it.val=v;it.low=v;it.high=v;it.src='user';
    const row=document.getElementById('row-'+it.id);
    if(row){row.querySelector('[data-v]').innerHTML=rowVal(it);row.querySelector('[data-sub]').innerHTML=rowSub(it)}
    const sm=document.getElementById('deep-summary');
    if(sm){const tmp=document.createElement('div');tmp.innerHTML=summaryHtml();sm.replaceWith(tmp.firstElementChild)}
  }
});
render();
if(S.T.on)refreshFX(false);

</script>
</body>
</html>
